services:
  cisco-monitor:
    build: .
    image: cisco-monitor:latest
    container_name: cisco-monitor
    pull_policy: build
    restart: unless-stopped
    ports:
      - "8189:8000"
    volumes:
      - cisco-monitor-data:/data
      # Bei SSH-Key-Login: eigenen privaten Key read-only reinmounten und
      # den Pfad im Einstellungen-Tab als /keys/id_rsa eintragen.
      # - /pfad/zu/deinem/id_rsa:/keys/id_rsa:ro
    environment:
      - CONFIG_DIR=/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.sipmonitor.rule=Host(`sipmonitor.wiederhol.de`)
      - traefik.http.routers.sipmonitor.entrypoints=http,https
      - traefik.http.routers.sipmonitor.tls=true
      - traefik.http.routers.sipmonitor.tls.certresolver=letsencrypt
      - traefik.http.services.sipmonitor.loadbalancer.server.port=8000

volumes:
  cisco-monitor-data:
proxy:
  external: true
